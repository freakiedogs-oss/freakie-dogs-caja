        - CELERY
        - MUSTARD
        - SULFITES
        - LUPINS
        - MOLLUSKS
    NutritionFacts:
      description: |
        Nutrition facts (e.g., amount of calories, amount of fat, sugar, etc.). 
        If no measurement basis is provided, amounts under nutrition facts are per 100g/100ml.
      properties:
        caffeineInGrams:
          description: |
            Amount of caffeine (value in grams)
          type: number
        measurementBasis:
          $ref: "#/components/schemas/MeasurementBasis"
        energyInKcal:
          description: |
            Amount of energy (value in kcal)
          type: number
        fat:
          $ref: "#/components/schemas/Fat"
        cholesterolInGrams:
          description: Amount of cholesterol (value in grams)
          type: number
        carbohydrate:
          $ref: "#/components/schemas/Carbohydrate"
        proteinInGrams:
          description: Amount of protein (value in grams)
          type: number
        saltInGrams:
          description: Amount of salt (value in grams)
          type: number
        sodiumInGrams:
          description: Amount of sodium (value in grams)
          type: number
    Fat:
      description: Nutrition facts for fat content
      properties:
        totalInGrams:
          description: Total amount of fats (value in grams)
          type: number
        saturatedInGrams:
          description: Amount of saturated fat (value in grams)
          type: number
        transInGrams:
          description: Amount of trans fat (value in grams)
          type: number
    Carbohydrate:
      description: Nutrition facts for carbohydrate content
      type: object
      properties:
        totalInGrams:
          description: Total amount of carbohydrates (value in grams)
          type: number
        dietaryFiberInGrams:
          description: Total amount of dietary fibers (value in grams)
          type: number
        sugar:
          $ref: "#/components/schemas/Sugar"
        polyolsGrams:
          description: Total amount of polyols (Sugar alcohols) (value in grams)
          type: number
    Sugar:
      description: Nutrition facts for sugar content
      type: object
      properties:
        totalInGrams:
          description: Total amount of sugar (value in grams)
          type: number
        addedInGrams:
          description: Total amount of added sugar (value in grams)
          type: number
    NetAmount:
      description: |
        Weight/volume of the product item.
      type: object
      properties:
        unit:
          $ref: "#/components/schemas/NetAmountUnit"
        value:
          description: The amount int the given unit
          type: number
      required:
        - unit
        - value
    NetAmountUnit:
      description: |
        The unit of the net amount (weight/volume). 
          - g to use for non liquids
          - ml to use for liquids
          - unit to use for servings, slices, portions, pieces, cups, etc.
      type: string
      enum:
        - g
        - ml
        - unit
    MeasurementBasis:
      description: |
        Measurement basis used for all values in the nutrition_facts object.
      type: string
      enum:
        - 100g
        - 100ml
        - unit
    LocalizedPreparationAndStorageInstructions:
      type: object
      description: |
        Preparation and storage instructions in different locales.
        
        To support multiple languages, we use localized strings, which are represented as a map.  
        The map's keys are language codes that conform to the 
        [IETF BCP 47 language tag](https://www.rfc-editor.org/info/rfc5646) standard.  
        A list of valid language codes can be found in the 
        [IANA language subtag registry](https://www.iana.org/assignments/language-subtag-registry/language-subtag-registry).

        Each set of localized strings **must** include a `default` key, 
        which provides the text in your default language
      properties:
        default:
          description: default content that will be present regardless of localisation requirements.
          type: string
          maxLength: 2000
      additionalProperties:
        x-additionalPropertiesName: <IETF-Language-Tag>
        description: |
          language specific entries, key should be a valid [IETF BCP 47 language tag](https://www.rfc-editor.org/info/rfc5646)
        type: string
        maxLength: 2000
      required:
        - default
      example:
        default: "in default language"
        de: "in german"
        fr: "in french"
