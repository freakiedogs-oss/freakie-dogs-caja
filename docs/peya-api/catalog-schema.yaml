        dietary:
          description: |
            Dietary preferences
          type: array
          items:
            $ref: "#/components/schemas/Dietary"
        netAmount:
          $ref: "#/components/schemas/NetAmount"
    Allergen:
      description: |
        Allergens
      type: string
      enum:
        - MILK_OR_LACTOSE
        - EGG
        - PEANUT
        - TREE_NUTS
        - CRUSTACEANS
        - FISH
        - GLUTEN
        - SOYA
