    AgeRestrictedItemTags:
      type: object
      properties:
        tags:
          type: object
          properties:
            ageRestrictedItem:
              description: |
                To comply with legal requirements, it's essential to provide information on items 
                that contain age-restricted ingredients and are requiring an id card check.
                
