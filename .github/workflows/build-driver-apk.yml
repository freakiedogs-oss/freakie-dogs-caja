name: Build Freakie Drivers APK

# Se dispara cuando cambia algo del proyecto Android driver o manualmente
on:
  push:
    branches: [main]
    paths:
      - 'android-driver/**'
      - '.github/workflows/build-driver-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute for gradlew (si existe)
        working-directory: android-driver
        run: |
          if [ ! -f gradlew ]; then
            # Genera el wrapper si no existe (primera vez)
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew

      - name: Build APK debug
        working-directory: android-driver
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: freakie-drivers-apk-debug
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar como Release (solo en main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-v${{ github.run_number }}
          name: Freakie Drivers v${{ github.run_number }}
          body: |
            APK debug generado automáticamente desde commit ${{ github.sha }}.
            Descargá `app-debug.apk` y sideloadeá en Android.
          files: android-driver/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
