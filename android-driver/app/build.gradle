plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.freakiedogs.driver'
    compileSdk 34

    defaultConfig {
        applicationId "com.freakiedogs.driver"
        minSdk 24            // Android 7.0 — cubre >98% de celulares en El Salvador
        targetSdk 34         // Android 14
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE") ?: "freakie-driver.keystore"
            storeFile file(ksFile)
            storePassword System.getenv("KS_PASS") ?: "changeme"
            keyAlias System.getenv("KS_ALIAS") ?: "freakiedriver"
            keyPassword System.getenv("KS_PASS") ?: "changeme"
        }
    }

    buildTypes {
        debug {
            // Instalable sin firma release para pruebas
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // Google Play Services Location — provee FusedLocationProviderClient, el mejor
    // API de GPS de Android (combina GPS, WiFi y celular para máxima precisión y ahorro batería).
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
